name: CI

# The repository shipped a field rename that broke 12 of 25 entry points and
# nothing caught it, because nothing ran. These gates are what stands between
# main and a repeat; see AUDIT.md for what each one is guarding against.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Python version the Dockerfile pins, so CI matches what actually ships.
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: coldstorage_project

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Django system checks
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py check --fail-level WARNING

      - name: No missing migrations
        # Guards model/migration drift: a model edited without a migration
        # passes every other gate here and then fails on deploy.
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py makemigrations --check --dry-run

      - name: Test suite (production security profile)
        # The configuration that actually ships: debug off, so HSTS, secure
        # session and CSRF cookies and the proxy SSL header are all live.
        # test_settings relaxes exactly one setting — the HTTPS redirect, which
        # the test client cannot follow — and SecuritySettingsUnderTestTests
        # fails if anything else is ever relaxed alongside it.
        run: |
          python manage.py test coldstorage \
            --settings=coldstorage_project.test_settings --verbosity 2

      - name: Test suite (development settings)
        # The configuration contributors actually run locally. Cheap, and it
        # catches breakage that only appears with debug on — the reverse of
        # what the profile above covers.
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py test coldstorage --verbosity 2

      - name: Deployment checks
        # The production security posture: HSTS, SSL redirect, secure session
        # and CSRF cookies. Runs with debug off and a real key, which is also
        # a live check that settings refuse to start without one.
        env:
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: example.com
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Validate the compose files
        # docker-compose.yml is the primary deployment interface, but the
        # steps below drive `docker run` directly and would never notice it
        # breaking. `docker compose config` needs no daemon and catches YAML
        # errors, bad interpolation and invalid keys. Runs before the build so
        # a broken compose file fails in seconds rather than after an image.
        env:
          DJANGO_SECRET_KEY: ci-validation-only
          DJANGO_ALLOWED_HOSTS: ci.example.com
        run: |
          echo "--- default: external reverse-proxy network"
          docker compose config -q
          echo "--- host-port override"
          docker compose -f docker-compose.yml -f docker-compose.hostport.yml config -q
          echo "--- compose-managed network"
          PROXY_NETWORK_EXTERNAL=false docker compose config -q

      - name: Compose refuses to start without the required settings
        # The guards are the difference between a clear error and a container
        # that boots with no secret key. Assert they actually fire.
        #
        # Neither variable is set at job level, so each case simply omits the
        # one under test. This step runs before .env.example is copied into
        # place, because compose auto-loads .env and would otherwise satisfy
        # the very variable being tested.
        run: |
          if DJANGO_ALLOWED_HOSTS=x docker compose config -q >/dev/null 2>&1; then
            echo "::error::compose accepted a missing DJANGO_SECRET_KEY"
            exit 1
          fi
          echo "--- correctly rejected a missing DJANGO_SECRET_KEY"

          if DJANGO_SECRET_KEY=x docker compose config -q >/dev/null 2>&1; then
            echo "::error::compose accepted a missing DJANGO_ALLOWED_HOSTS"
            exit 1
          fi
          echo "--- correctly rejected a missing DJANGO_ALLOWED_HOSTS"

      - name: .env.example is a working starting point
        # The README tells people to `cp .env.example .env`. That path has to
        # produce a compose file that parses, or the first thing a new
        # deployment hits is an interpolation error.
        run: |
          cp .env.example .env
          sed -i 's/^DJANGO_SECRET_KEY=$/DJANGO_SECRET_KEY=ci-validation-only/' .env
          docker compose config -q
          rm -f .env

      - name: Build image
        # The Dockerfile was unbuildable for the whole life of the repo: it ran
        # `python manage.py` from /app while manage.py sits in
        # /app/coldstorage_project. Nothing caught it because nobody built it
        # in CI. Now something does.
        run: docker build -t flux-datalist:ci .

      - name: Container starts, migrates, and serves
        # Exercises the real path: entrypoint applies migrations, settings
        # import with debug off, and the WSGI callable resolves under gunicorn.
        run: |
          docker run --rm \
            -e DJANGO_DEBUG=0 \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            flux-datalist:ci \
            gunicorn --check-config coldstorage_project.wsgi:application

      - name: Container refuses to start without a secret key
        # The negative case matters as much as the positive one: a deployment
        # that forgets DJANGO_SECRET_KEY must fail loudly rather than quietly
        # serving with a fallback.
        run: |
          if docker run --rm -e DJANGO_DEBUG=0 flux-datalist:ci \
               gunicorn --check-config coldstorage_project.wsgi:application; then
            echo "::error::Image started with DEBUG off and no DJANGO_SECRET_KEY"
            exit 1
          fi
          echo "Correctly refused to start without DJANGO_SECRET_KEY."
